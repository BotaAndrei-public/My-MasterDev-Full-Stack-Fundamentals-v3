<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Bucharest Clock</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117; color: #c9d1d9;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; flex-direction: column; text-align: center;
        }
        .clock-container {
            background-color: #161b22; border: 1px solid #30363d;
            border-radius: 16px; padding: 2.5rem; width: 90%; max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; color: #8b949e; margin-bottom: 1rem; }
        .time-box { font-size: 3.5rem; font-weight: 700; color: #58a6ff; font-variant-numeric: tabular-nums; margin-bottom: 1.5rem; }
        .status-badge { display: inline-block; background-color: rgba(56, 139, 253, 0.15); color: #58a6ff; padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
        .status-badge.connecting { background-color: rgba(210, 153, 34, 0.15); color: #d29922; }
    </style>
</head>
<body>

    <div class="clock-container">
        <h1>Bucharest Clock Time</h1>
        <div id="clock-display" class="time-box">--:--:--</div>
        <div id="status" class="status-badge connecting">Connecting...</div>
    </div>

    <script>
        let ws;
        let clockTimer;
        let serverTimeOffset = 0;
        
        const clockDisplay = document.getElementById('clock-display');
        const statusBadge = document.getElementById('status');

        function connect() {
            const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${window.location.host}`);  
            
            ws.onopen = () => {
                statusBadge.innerText = "Live Synced";
                statusBadge.className = "status-badge";
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    // Safely route the object type
                    if (data.type === 'time') {
                        serverTimeOffset = data.timestamp - Date.now();
                        if (!clockTimer) startClockTicking();
                    }
                } catch (e) {
                    // Ignore non-JSON raw fallback text safely
                    console.log("Raw text fallback:", event.data);
                }
            };

            ws.onclose = () => {
                statusBadge.innerText = "Disconnected. Retrying...";
                statusBadge.className = "status-badge connecting";
                clearInterval(clockTimer);
                clockTimer = null;
                setTimeout(connect, 2000);
            };
        }

        function startClockTicking() {
            if (clockTimer) clearInterval(clockTimer);
            clockTimer = setInterval(() => {
                const correctTime = new Date(Date.now() + serverTimeOffset);
                clockDisplay.innerText = correctTime.toLocaleTimeString('ro-RO', {
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
            }, 1000);
        }

        connect();
    </script>
</body>
</html>
