<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Bucharest Clock Time</h1>
    <h2 id="clock-display">Waiting for server time...</h2>
</body>
    
<script>
    let ws;
    const proto = window.location.protocol  === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${window.location.host}`);  
    
    ws.onmessage = (event) => {
                console.log(event.data);
                
                // Check if the message contains the time from the server
                if (event.data.includes("Ora exactă este:")) {
                    // Update the text in our h2 element
                    document.getElementById('clock-display').innerText = event.data;
                }
            };


</script>

</html>
