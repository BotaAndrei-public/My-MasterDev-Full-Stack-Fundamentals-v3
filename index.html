<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Ora Server</title>
</head>
<body>
    <h1>Ora de pe server: <span id="ora">Se încarcă...</span></h1>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        ws.onmessage = (event) => {
            document.getElementById('ora').innerText = event.data;
        };
    </script>
</body>
</html>
